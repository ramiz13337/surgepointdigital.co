<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Private · SurgePoint Digital</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FCFCFA;--ink:#111110;--gray:#45443F;--dim:#6B6B66;--line:#E2E1DC;--red:#D91F11}
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 24px;
    background:var(--paper);color:var(--ink);
    font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .box{max-width:460px;text-align:center}
  .mark{display:inline-flex;align-items:center;gap:11px;margin-bottom:28px}
  .mark i{width:24px;height:24px;background:linear-gradient(135deg,var(--ink) 0 50%,var(--red) 50% 100%)}
  .mark b{font-size:16px;font-weight:800;letter-spacing:-.02em}
  h1{font-size:clamp(26px,7vw,34px);font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:0 0 14px}
  p{margin:0;color:var(--gray);font-size:16px}
  .kick{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--red);margin-bottom:16px}
  .back{display:inline-block;margin-top:30px;padding-top:22px;border-top:1px solid var(--line);
    font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;color:var(--dim);
    text-decoration:none;letter-spacing:.04em}
  .back:hover{color:var(--red)}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RLND9SY3KR"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-RLND9SY3KR');
</script>
</head>
<body>
  <div class="box">
    <div class="mark"><i></i><b>SurgePoint Digital</b></div>
    <div class="kick">Private</div>
    <h1>Nothing to see here.</h1>
    <p>Proposals live behind direct links we send to clients. If you were sent one, use that link. If you think you should have one, get in touch.</p>
    <a class="back" href="https://surgepointdigital.co/">surgepointdigital.co &nearr;</a>
  </div>
</body>
</html>
