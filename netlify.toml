[build]
  publish = "."

# Security + caching headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Client proposals: keep this whole path out of every search index.
# Deliberately NOT blocked in robots.txt -- a crawler has to be allowed to
# fetch the page in order to see the noindex directive below.
[[headers]]
  for = "/proposals"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"

[[headers]]
  for = "/proposals/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"

# HTML: never cache — always revalidate
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Static assets: cache 1 year (use content-hashed filenames)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The Miramar site moved to its own domain. Anyone holding the old preview
# link lands on the real thing instead of a 404.
[[redirects]]
  from = "/proposals/staging/miramar-dmv/*"
  to = "https://www.miramarinsuranceservices.com/:splat"
  status = 301
  force = true
